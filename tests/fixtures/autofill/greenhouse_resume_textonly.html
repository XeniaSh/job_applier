<!DOCTYPE html>
<html>
<head><title>Greenhouse resume body-text decoy</title></head>
<body>
  <!-- The file input is never given a file: `input.files` stays empty.
       The body text below merely echoes a filename (as an upload-rejection
       toast or unrelated copy legitimately could) and must never be
       mistaken for a real attachment. -->
  <p>We previously received resume.pdf from another applicant. Please upload yours below.</p>
  <input type="file" id="resume" name="resume" />
</body>
</html>
