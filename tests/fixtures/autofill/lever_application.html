<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Apply — Example Corp</title>
</head>
<body>
  <div class="application-page">
    <h2>Senior Backend Engineer</h2>
    <form id="application-form" method="post" action="/apply">
      <div class="section page-centered">
        <div class="section-wrapper">
          <div class="application-question">
            <label for="name">Full name<span class="required">*</span></label>
            <input id="name" name="name" type="text" class="app-input" required>
          </div>
          <div class="application-question">
            <label for="email">Email<span class="required">*</span></label>
            <input id="email" name="email" type="email" class="app-input" required>
          </div>
          <div class="application-question">
            <label for="phone">Phone</label>
            <input id="phone" name="phone" type="tel" class="app-input">
          </div>
          <div class="application-question">
            <label for="org">Current company</label>
            <input id="org" name="org" type="text" class="app-input">
          </div>
          <div class="application-question">
            <label for="urls_LinkedIn">LinkedIn URL<span class="required">*</span></label>
            <input id="urls_LinkedIn" name="urls[LinkedIn]" type="text" class="app-input" required>
          </div>
          <div class="application-question">
            <label for="urls_GitHub">GitHub</label>
            <input id="urls_GitHub" name="urls[GitHub]" type="text" class="app-input">
          </div>
        </div>
      </div>
      <div class="section page-centered">
        <div class="section-wrapper">
          <div class="application-question">
            <label for="resume-upload-input">Resume/CV<span class="required">*</span></label>
            <input id="resume-upload-input" class="resume-upload-input-file" name="resume" type="file" required>
          </div>
        </div>
      </div>
      <div class="section page-centered application-additional">
        <div class="section-wrapper">
          <div class="application-question">
            <div class="application-label">Will you now or in the future require visa sponsorship?<span class="required">*</span></div>
            <select name="selectedLocations" id="sponsorship_select" required>
              <option value="">Select...</option>
              <option value="Yes">Yes</option>
              <option value="No">No</option>
            </select>
          </div>
          <div class="application-question">
            <div class="application-label">Are you legally authorized to work in Germany?<span class="required">*</span></div>
            <div class="radio-btn-group">
              <label><input type="radio" name="cards[work_auth]" value="Yes" required> Yes</label>
              <label><input type="radio" name="cards[work_auth]" value="No"> No</label>
            </div>
          </div>
          <div class="application-question">
            <div class="application-label">What is your favorite IDE?<span class="required">*</span></div>
            <input type="text" name="cards[favorite_ide]" required>
          </div>
          <div class="application-question">
            <div class="application-label">Why do you want to work here?</div>
            <textarea name="comments" id="comments"></textarea>
          </div>
          <div class="application-question">
            <label class="checkbox-label">
              <input type="checkbox" name="newsletter" id="newsletter" value="1">
              Subscribe to our newsletter
            </label>
          </div>
        </div>
      </div>
      <div class="section page-centered eeo-container">
        <div class="section-wrapper">
          <div class="application-question">
            <div class="application-label">Gender*</div>
            <select name="eeo[gender]" id="gender" required>
              <option value="">Decline to self-identify</option>
              <option value="Female">Female</option>
              <option value="Male">Male</option>
            </select>
          </div>
        </div>
      </div>
      <button type="submit" id="submit_app" class="postings-btn template-btn-submit">Submit application</button>
    </form>
  </div>
  <script>
    window.__submitClicked = false;
    window.__formSubmitted = false;
    document.getElementById("submit_app").addEventListener("click", function (event) {
      window.__submitClicked = true;
    });
    document.getElementById("application-form").addEventListener("submit", function (event) {
      event.preventDefault();
      window.__formSubmitted = true;
    });
  </script>
</body>
</html>
