<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Job Application — Example Corp (resume with adjacent button)</title>
</head>
<body>
  <h1>Senior Backend Engineer</h1>
  <form id="application_form" data-ats="greenhouse" action="/job_applications" method="post">
    <label for="first_name">First Name</label>
    <input id="first_name" name="job_application[first_name]" type="text" required>

    <label for="email">Email</label>
    <input id="email" name="job_application[email]" type="email" required>

    <label for="resume">Resume/CV</label>
    <input id="resume" name="job_application[resume]" type="file" required>
    <button type="button" id="remove_resume">Remove</button>

    <label for="portfolio">Portfolio (optional)</label>
    <input id="portfolio" name="job_application[portfolio]" type="file">

    <button type="submit" id="submit_app">Submit Application</button>
  </form>
</body>
</html>
