<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Job Application — Example Corp</title>
</head>
<body>
  <h1>Senior Backend Engineer</h1>
  <form id="application_form" data-ats="greenhouse" action="/job_applications" method="post">
    <label for="first_name">First Name</label>
    <input id="first_name" name="job_application[first_name]" type="text" required>

    <label for="last_name">Last Name</label>
    <input id="last_name" name="job_application[last_name]" type="text" required>

    <label for="email">Email</label>
    <input id="email" name="job_application[email]" type="email" required>

    <label for="phone">Phone</label>
    <input id="phone" name="job_application[phone]" type="tel" required>

    <label for="linkedin">LinkedIn Profile</label>
    <input id="linkedin" name="job_application[urls][linkedin]" type="url">

    <label for="resume">Resume/CV</label>
    <input id="resume" name="job_application[resume]" type="file" required>

    <fieldset>
      <legend>Will you now or in the future require visa sponsorship?</legend>
      <label><input type="radio" name="job_application[sponsorship]" value="Yes"> Yes</label>
      <label><input type="radio" name="job_application[sponsorship]" value="No"> No</label>
    </fieldset>

    <label for="work_auth">Are you legally authorized to work in Germany?</label>
    <select id="work_auth" name="job_application[work_authorization]" required>
      <option value="">Please select</option>
      <option value="Yes">Yes</option>
      <option value="No">No</option>
    </select>

    <label for="favorite_ide">What is your favorite IDE?</label>
    <input id="favorite_ide" name="job_application[favorite_ide]" type="text" required>

    <label for="gender">Gender*</label>
    <select id="gender" name="job_application[gender]" required>
      <option value="">Prefer not to disclose</option>
      <option value="female">Female</option>
      <option value="male">Male</option>
    </select>

    <label>
      <input id="newsletter" type="checkbox" name="job_application[newsletter]" value="1">
      Subscribe to newsletter
    </label>

    <label for="cover_note">Why do you want to work here?</label>
    <textarea id="cover_note" name="job_application[cover_note]"></textarea>

    <button type="submit" id="submit_app">Submit Application</button>
  </form>
  <script>
    window.__submitClicked = false;
    window.__formSubmitted = false;
    document.getElementById("submit_app").addEventListener("click", function (event) {
      window.__submitClicked = true;
    });
    document.getElementById("application_form").addEventListener("submit", function (event) {
      event.preventDefault();
      window.__formSubmitted = true;
    });
  </script>
</body>
</html>
