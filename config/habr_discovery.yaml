# Read only when HABR_DISCOVERY_ENABLED=true. Default activation is false.
rss:
  queries: [Java, Kotlin, JVM backend, AI backend]
  remote_only: true
  max_pages: 2
  timeout_seconds: 15
  max_response_bytes: 1000000
  max_items: 100
  max_age_days: 30
interval_seconds: 3600
detail_ttl_seconds: 86400
detail_request_interval_seconds: 1
max_detail_requests: 5
# Persisted first-feed cohort: at most this many per polling interval, including restarts/retries.
initial_backlog_limit: 3
batch_limit: 5
state_dir: data/habr
