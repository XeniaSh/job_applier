# JobApplier target companies: Tier A starter list
# Generated: 2026-09-05
# Purpose: monitor companies that are more likely than random LinkedIn jobs to hire internationally
# and work in English or English/Russian environments.
#
# relocation_status values:
#   confirmed_role_based: company/job posts explicitly mention relocation/visa support for some roles
#   remote_global: globally distributed / worldwide remote; relocation is not the main path
#   remote_region_limited: remote/hybrid in specific countries only; check eligibility per role
#   mixed_check_per_role: company is international, but relocation/visa must be checked on every vacancy
#
# language values:
#   english: English is required/used in international teams or job posts
#   english_russian_signal: English required, plus Russian-speaking/CIS-friendly signal; not a guarantee that Russian is official working language
#
# ats values are best-effort and should be verified before implementing watchers.
# role_title_keywords match the job title only (OR).
# role_keywords is a legacy alias applied to title only when role_title_keywords is empty.
# exclude_title_keywords are added to the built-in title exclude list.
# role_description_keywords is reserved and is not a hard filter yet.

