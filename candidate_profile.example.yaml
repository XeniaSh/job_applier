# Synthetic Candidate Profile for autofill.
# Safe for Git and coding agents. Values are fake.
#
# Runtime overlay (not committed): candidate_profile.local.yaml
# Copy this file, replace values, and keep the local file untracked.

identity:
  first_name: Ada
  last_name: Example
  email: ada.example@example.test
  phone: "+15555550100"
  current_location: "Berlin, Germany"
  country: Germany

professional_links:
  linkedin: "https://www.linkedin.com/in/ada-example-test"
  github: "https://github.com/ada-example-test"
  website: "https://ada.example.test"
  gitlab_username: null
  open_source_urls: []

employment:
  current_title: Backend Engineer
  # Optional "Current company" fields stay blank unless this is set. Never
  # guessed from employment history, resume text, or LLM answer generation.
  current_employer: null
  years_of_experience: 7
  years_of_relevant_experience: 7
  notice_period: "30 days"
  open_to_relocation: true
  relocation_destinations:
    - Bangkok
    - Thailand
  # Awarded degree is master's-level (including a completed Russian specialist).
  # Completed postgraduate / aspirantura study is not an awarded doctorate.
  highest_academic_level: Master's
  postgraduate_studies_completed: true
  doctorate_awarded: false
  professional_tech_stack:
    - Java
    - Kotlin
    - Spring Boot
    - PostgreSQL
    - Kafka
  primary_programming_language: Java
  # Explicit years per technology/language/tool, for "Minimum Years of
  # experience in <Tech> *" style questions. A technology-specific question
  # with no matching entry here stays unresolved: it never inherits overall
  # years_of_experience/years_of_relevant_experience and is never guessed.
  # This example intentionally ships empty: any value here would deep-merge
  # into your local overlay and invent a fact you never configured. Add your
  # own entries in candidate_profile.local.yaml, for example:
  #   technology_years:
  #     - technology: Java
  #       years: 7
  technology_years: []
  preferred_fields_of_interest:
    - Backend
    - Platform
  salary_expectations:
    amount: 80000
    currency: EUR
    period: yearly
    fill_salary: false

work_eligibility:
  citizenship:
    - Germany
  work_authorizations:
    - country: Germany
      authorized: true
      requires_sponsorship: false
  requires_visa_sponsorship: false
  current_location_requires_visa_sponsorship: false

application_files:
  default_resume: resumes/example_java_backend.pdf
  alternative_resumes: []
  cover_letter_strategy: generate

employee_relationship:
  has_relationship: false
  how_known: null
  employee_name: null

application_consent:
  privacy_data_processing: true
  recruiting_contact: null

application_policy:
  relocation:
    willing: true
  office_work:
    willing: true
  # Onsite/hybrid vs remote-scope preference for questions such as "What
  # working arrangement are you ideally looking for?". One of HYBRID_ONSITE,
  # REMOTE_IN_LISTED_COUNTRIES, REMOTE_OUTSIDE_LISTED_COUNTRIES,
  # OPEN_ONSITE_OR_LISTED_COUNTRIES, or null (unset -- leave unresolved).
  remote_work_arrangement:
    preference: null
  privacy_acknowledgement:
    auto_acknowledge_required: true
  default_no_undeclared_affiliations: true
  # Factual only. Unset means do not answer. Do not reuse for criminal,
  # background, export-control, or certification questions.
  has_employment_or_post_employment_restrictions: false
  newsletter_opt_in: false
  sms_interview_updates: false
  prefer_not_to_disclose_gender: true
  prior_affiliations:
    - organization: Deloitte
      associated: false
  application_source_preference:
    - Company Website
    - Careers Website
    - Careers Page
    - Direct Application
    - LinkedIn
    - Other
  question_overrides:
    - question_contains: "engineering blog"
      answer: true
    - question_contains:
        - "applied"
        - "past 6 months"
      answer: false

sensitive:
  # Factual demographic data. Application forms use ApplicationPolicy
  # prefer_not_to_disclose_gender and do not send this value.
  gender: Female
  ethnicity: null
  disability: null
  veteran_status: null

fill_sensitive_fields: false
